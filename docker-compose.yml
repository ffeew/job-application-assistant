name: job-application-assistant

x-database-environment: &database-environment
  PGHOST: db
  PGUSER: ${POSTGRES_USER:-job_assistant}
  PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  PGDATABASE: ${POSTGRES_DB:-job_assistant}

x-runtime-environment: &runtime-environment
  <<: *database-environment
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL to your public HTTPS origin}
  DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
  GROQ_API_KEY: ${GROQ_API_KEY:?Set GROQ_API_KEY in .env}
  GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
  GROQ_FALLBACK_MODEL: ${GROQ_FALLBACK_MODEL:-openai/gpt-oss-120b}
  LATEX_COMPILER_URL: http://latex-compiler:8080
  LATEX_COMPILER_TOKEN: ${LATEX_COMPILER_TOKEN:?Set LATEX_COMPILER_TOKEN in .env}
  OBJECT_STORAGE_URL: http://seaweedfs:8333
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-job-assistant}
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:?Set OBJECT_STORAGE_ACCESS_KEY in .env}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:?Set OBJECT_STORAGE_SECRET_KEY in .env}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-job_assistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-job_assistant}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: .
      target: migrator
    environment: *database-environment
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  latex-compiler:
    build:
      context: .
      dockerfile: services/latex-compiler/Dockerfile
    restart: unless-stopped
    environment:
      LATEX_COMPILER_TOKEN: ${LATEX_COMPILER_TOKEN:?Set LATEX_COMPILER_TOKEN in .env}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    stop_grace_period: 20s

  ocr:
    build: ./services/ocr
    restart: unless-stopped
    environment:
      OCR_SERVICE_TOKEN: ${OCR_SERVICE_TOKEN:?Set OCR_SERVICE_TOKEN in .env}
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    networks: [ocr]

  # Keeps imported files and saved resume PDFs behind an S3 endpoint.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    # One process runs the master, volume server, filer and S3 gateway. The
    # parts this stack does not use are switched off.
    command:
      - mini
      - -dir=/data
      - -webdav=false
      - -admin.ui=false
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      # Without credentials the gateway accepts every request. They are read on
      # each start, so changing them in .env and recreating the stack rotates them.
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY:?Set OBJECT_STORAGE_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY:?Set OBJECT_STORAGE_SECRET_KEY in .env}
      S3_BUCKET: ${OBJECT_STORAGE_BUCKET:-job-assistant}
    # The image's unprivileged account, which already owns /data in a new volume.
    user: "1000:1000"
    volumes:
      - seaweedfs-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    healthcheck:
      test: [CMD, curl, -fsS, -o, /dev/null, http://127.0.0.1:8333/healthz]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [storage]

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      <<: *runtime-environment
      OCR_SERVICE_URL: http://ocr:8080
      OCR_SERVICE_TOKEN: ${OCR_SERVICE_TOKEN:?Set OCR_SERVICE_TOKEN in .env}
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    networks: [default, ocr, storage]
    depends_on:
      migrate:
        condition: service_completed_successfully
      latex-compiler:
        condition: service_healthy
      ocr:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment: *runtime-environment
    stop_grace_period: 200s
    networks: [default, storage]
    depends_on:
      migrate:
        condition: service_completed_successfully
      latex-compiler:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

networks:
  # The OCR service parses uploaded files and needs no other connection, so
  # its network reaches only the app: no internet, database, or compiler.
  ocr:
    internal: true
  # Only the S3 port checks credentials; the storage server's other ports
  # answer anyone who can reach them. This network reaches only the app and
  # worker: no internet, database, or compiler.
  storage:
    internal: true

volumes:
  postgres-data:
  seaweedfs-data:
