name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# PR updates cancel stale checks to free runner capacity. Active main runs
# are allowed to finish so their results remain available.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js and pnpm
        id: setup
        uses: ./.github/actions/setup
      - name: Run format check
        run: pnpm run format:check
      # The later checks still run after a failure, so one push reports them all.
      - name: Run lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run lint
      - name: Run typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run typecheck
      - name: Run tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run test

  postgres-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: job_assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d job_assistant_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      RUN_DB_INTEGRATION: "1"
      DATABASE_URL: postgresql://test:test@localhost:5432/job_assistant_test
      BETTER_AUTH_SECRET: test-only-secret-at-least-thirty-two-characters
      BETTER_AUTH_URL: http://localhost:3000
      GROQ_API_KEY: test-only
      RESEND_API_KEY: ""
      RESEND_FROM_EMAIL: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup
      - name: Run integration tests
        run: pnpm run test:integration

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Each shard runs its own isolated stack; tests within it stay serial.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      E2E_LATEX_IMAGE: job-assistant-e2e-latex:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup
      - name: Install Chromium and system dependencies
        # Ubuntu mirrors sometimes stall apt until the job times out; a slow but
        # healthy mirror has taken 5 minutes, so each attempt gets 6.
        timeout-minutes: 20
        run: |
          for attempt in 1 2 3; do
            timeout --kill-after=30s 6m pnpm exec playwright install --with-deps chromium && exit 0
            echo "::warning::Chromium install attempt $attempt failed or timed out"
          done
          exit 1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the real PDF compiler
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/latex-compiler/Dockerfile
          load: true
          tags: ${{ env.E2E_LATEX_IMAGE }}
          cache-from: type=gha,scope=latex
          # One writer, so the shards do not race to export the same cache.
          cache-to: ${{ matrix.shard == 1 && 'type=gha,mode=max,scope=latex' || '' }}
      # The runner has no TeX, so outside the image these tests would skip.
      - name: Run compiler tests against real pdfLaTeX
        if: ${{ matrix.shard == 1 }}
        run: >
          docker run --rm --user "$(id -u):$(id -g)"
          --env HOME=/tmp --env REQUIRE_TEX=1
          --volume "$PWD:/work" --workdir /work "$E2E_LATEX_IMAGE"
          node_modules/.bin/vitest run services/latex-compiler
      - name: Run browser tests
        # Backstop for Playwright's own global timeout, which stops cleanly.
        timeout-minutes: 22
        run: pnpm run test:e2e --shard=${{ matrix.shard }}/4
      - name: Upload browser reports and service logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results-${{ matrix.shard }}
          path: artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 7

  compose-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_PASSWORD: ci-only-database-password
      BETTER_AUTH_SECRET: ci-only-secret-at-least-thirty-two-characters
      BETTER_AUTH_URL: http://localhost:3000
      GROQ_API_KEY: ci-only
      LATEX_COMPILER_TOKEN: ci-only-compiler-token-at-least-thirty-two-characters
      OCR_SERVICE_TOKEN: ci-only-ocr-token-at-least-thirty-two-characters
      OBJECT_STORAGE_ACCESS_KEY: ci-only-storage-key
      OBJECT_STORAGE_SECRET_KEY: ci-only-storage-secret-at-least-thirty-two-characters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # The two slow images are tagged with Compose's default names so the stack
      # starts from them instead of rebuilding without the layer cache.
      - name: Build the OCR service and run its smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/ocr
          load: true
          tags: job-application-assistant-ocr
          cache-from: type=gha,scope=ocr
          cache-to: type=gha,mode=max,scope=ocr
      - name: Build the PDF compiler
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: services/latex-compiler/Dockerfile
          load: true
          tags: job-application-assistant-latex-compiler
          cache-from: type=gha,scope=latex
      - name: Build the app, worker, and migration images
        env:
          # The engine's own builder stores images where Compose looks for them.
          BUILDX_BUILDER: default
        run: docker compose build migrate worker app
      - name: Start the stack and wait for every health check
        run: docker compose up --no-build --wait --wait-timeout 180
      - name: Check the published health endpoint
        run: curl --fail --silent --show-error http://127.0.0.1:3000/api/health
      - name: Show service state and logs
        if: ${{ failure() }}
        run: |
          docker compose ps --all
          docker compose logs --no-color
