name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: pnpm run lint
      - name: Run typecheck
        run: pnpm run typecheck
      - name: Run tests
        run: pnpm run test

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: job_assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d job_assistant_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      RUN_DB_INTEGRATION: "1"
      DATABASE_URL: postgresql://test:test@localhost:5432/job_assistant_test
      BETTER_AUTH_SECRET: test-only-secret-at-least-thirty-two-characters
      BETTER_AUTH_URL: http://localhost:3000
      GROQ_API_KEY: test-only
      RESEND_API_KEY: ""
      RESEND_FROM_EMAIL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:integration

  ocr-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the OCR service and run its smoke test
        uses: docker/build-push-action@v6
        with:
          context: services/ocr
          cache-from: type=gha,scope=ocr
          cache-to: type=gha,mode=max,scope=ocr

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_LATEX_IMAGE: job-assistant-e2e-latex:ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v3
      - name: Build the real PDF compiler
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/latex-compiler/Dockerfile
          load: true
          tags: job-assistant-e2e-latex:ci
          cache-from: type=gha,scope=e2e-latex
          cache-to: type=gha,mode=max,scope=e2e-latex
      - name: Run browser tests
        run: pnpm run test:e2e
      - name: Upload browser reports and service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 7
