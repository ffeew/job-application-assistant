<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fill this application</title>
    <style>
      /* Copied from src/app/globals.css: the panel has no Tailwind build. */
      :root {
        --background: #efd8a1;
        --foreground: #1c2030;
        --card: #ffffff;
        --primary: #2a44f0;
        --primary-foreground: #ffffff;
        --muted-foreground: #5a4f33;
        --destructive: #b31b2c;
        --warning: #9a5200;
        --success: #1a7f4b;
        --border: rgb(150 108 40 / 0.38);
        --sheet-shadow:
          0 0 0 1px rgb(150 108 40 / 0.2), 0 1px 2px rgb(74 52 12 / 0.14),
          0 10px 18px -14px rgb(74 52 12 / 0.55);
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #2b2518;
          --foreground: #f3ead3;
          --card: #383020;
          --primary: #efd8a1;
          --primary-foreground: #1c2030;
          --muted-foreground: #bcaf8f;
          --destructive: #ff8a80;
          --warning: #f2b45c;
          --success: #5fd39a;
          --border: rgb(239 216 161 / 0.16);
          --sheet-shadow:
            0 0 0 1px rgb(239 216 161 / 0.1), 0 10px 18px -14px rgb(0 0 0 / 0.8);
        }
      }
      body {
        margin: 0;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        background: var(--background);
        color: var(--foreground);
        font:
          14px/1.45 Archivo,
          ui-sans-serif,
          system-ui,
          sans-serif;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 700;
      }
      h2 {
        margin: 0;
        font-size: 16px;
      }
      p {
        margin: 0;
      }
      label,
      .stack {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .row {
        display: flex;
        flex-direction: row;
        gap: 8px;
        align-items: center;
      }
      input[type="url"],
      select {
        font: inherit;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: var(--card);
        color: var(--foreground);
      }
      button {
        font: inherit;
        font-weight: 600;
        padding: 8px 12px;
        border: 0;
        border-radius: 4px;
        background: var(--primary);
        color: var(--primary-foreground);
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      button.quiet {
        background: transparent;
        color: var(--foreground);
        border: 1px solid var(--border);
      }
      :focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      .muted {
        color: var(--muted-foreground);
      }
      .error {
        color: var(--destructive);
      }
      .sheet {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 12px;
        background: var(--card);
        box-shadow: var(--sheet-shadow);
        border-radius: 4px;
      }
      ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      li {
        display: flex;
        flex-direction: column;
        border-left: 3px solid var(--success);
        padding-left: 8px;
      }
      li.drafted {
        border-left-style: dashed;
        border-left-color: var(--warning);
      }
      li.needs {
        border-left-style: dotted;
        border-left-color: var(--destructive);
      }
      .value {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        max-height: 6.5em;
        overflow: auto;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>Fill this application</h1>

    <form id="settings" class="stack">
      <label>
        App address
        <input
          id="app-url"
          type="url"
          required
          placeholder="https://jobs.example.com"
        />
      </label>
      <p class="muted">
        Sign in to the app in this browser first. The extension uses that
        session.
      </p>
      <div class="row">
        <button type="submit">Save address</button>
      </div>
    </form>

    <section id="fill-section" class="stack" hidden>
      <label>
        Tracked application
        <select id="application">
          <option value="">None, use my profile only</option>
        </select>
      </label>
      <div class="row">
        <button id="fill" type="button">Fill this page</button>
        <button id="edit-address" type="button" class="quiet">
          Change address
        </button>
      </div>
    </section>

    <p id="status" role="status" aria-live="polite"></p>

    <section id="preview" class="stack" hidden>
      <h2>Check before applying</h2>
      <p class="muted">
        Nothing goes into the page until you apply. Untick a site to leave its
        fields alone. You still submit the application yourself.
      </p>
      <div id="frames" class="stack"></div>
      <div class="row">
        <button id="apply" type="button">Apply to the page</button>
      </div>
    </section>

    <section id="results" class="stack" hidden>
      <h2>Needs you</h2>
      <ul id="needs"></ul>
    </section>

    <script src="dist/panel.js"></script>
  </body>
</html>
